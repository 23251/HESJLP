# Publishes the website to GitHub Pages.
#
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# Only the website files are published. Tooling, screenshots, database files,
# and this workflow are left out.
#
# One-time setup in GitHub: Settings > Pages > Build and deployment > Source:
# choose "GitHub Actions". See README.md, "Publish changes".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these. Nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Collect the website files
        run: |
          mkdir -p _site
          cp index.html about.html clinics.html get-care.html keep-your-medicaid.html who-to-call.html config.js _site/
          cp -r assets _site/assets
          # Pages serves these files as-is. No Jekyll processing.
          touch _site/.nojekyll
          echo "Files to publish:"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
